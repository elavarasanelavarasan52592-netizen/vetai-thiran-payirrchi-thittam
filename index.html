<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduGenie - Learning Assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}" />
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">AI-POWERED LEARNING ASSISTANT</p>
        <h1>EduGenie</h1>
        <p>Ask questions, simplify concepts, generate quizzes, summarize notes, and build a learning path.</p>
      </div>
      <div class="status-pill"><span></span> Gemini connected through backend</div>
    </header>

    <section class="panel">
      <label for="task">Choose a task</label>
      <select id="task">
        <option value="qa">Ask a Question</option>
        <option value="explain">Explain a Topic</option>
        <option value="quiz">Generate Quiz</option>
        <option value="summarize">Summarize Text</option>
        <option value="learn">Learning Path</option>
      </select>

      <label for="inputText" id="inputLabel">Your question</label>
      <textarea id="inputText" rows="9" placeholder="Example: Which is the largest ocean?"></textarea>

      <button id="submitBtn">Generate Answer</button>
      <p id="error" class="error" hidden></p>
    </section>

    <section class="result-panel" id="resultPanel" hidden>
      <div class="result-header">
        <h2 id="resultTitle">Result</h2>
        <button class="copy-btn" id="copyBtn">Copy</button>
      </div>
      <div id="result"></div>
    </section>

    <footer>
      EduGenie is an educational assistant. Verify important academic facts with trusted sources.
    </footer>
  </main>
  <script src="{{ url_for('static', path='app.js') }}"></script>
</body>
</html>
